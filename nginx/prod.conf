worker_processes auto;

events {
	use epoll;
	worker_connections 1024;
}

http {
	server_tokens off;
	include mime.types;
	charset utf-8;
	client_max_body_size 4M; # default

	proxy_connect_timeout 60s;
	proxy_read_timeout 60s;
	proxy_send_timeout 60s;

	# hide backend framework fingerprint
	proxy_hide_header X-Powered-By;

	# TLS: only modern protocols, let the client pick the cipher (TLSv1.3 ordering)
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	# security headers
	# NOTE: add_header is NOT inherited by a block that defines its own add_header.
	# If you add one in a server/location below, repeat these there too.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# websocket upgrade: only send "Connection: upgrade" when the client actually asked for it
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# request limits
	limit_req_status 429; # tell clients "Too Many Requests" instead of 503
	limit_conn_status 429;

	limit_req_zone $binary_remote_addr zone=api_limit:1m rate=5r/s;
	limit_req_zone $binary_remote_addr zone=login_limit:1m rate=10r/m; # credential endpoints - brute force guard
	limit_conn_zone $binary_remote_addr zone=conn_limit:1m;

	server {
		listen 80;
		server_name _;

		# ACME challenge for SSL cert
		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}

		location / {
			return 301 https://$host$request_uri; # redirect HTTP to HTTPS
		}
	}

	# global4pl.cz
	server {
		listen 443 ssl;
		http2 on;
		server_name global4pl.cz;

		# paths to SSL certs and key files (binded path in nginx container)
		ssl_certificate 		/etc/letsencrypt/live/nest.global4pl.cz/fullchain.pem; # global4pl.cz is also included in the cert saved there
		ssl_certificate_key 	/etc/letsencrypt/live/nest.global4pl.cz/privkey.pem;

		access_log /var/log/nginx/global4pl.cz-access.log;

		client_max_body_size 20M; # 20 MB
		limit_conn conn_limit 20;

		location / {
			proxy_pass http://172.17.0.1:3000;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;

			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# NOTE: this proxies the Strapi admin panel. Restrict it (IP allowlist / auth)
		# or move it to a non-obvious path - it is an admin UI on a public route.
		location /strapi/ {
			limit_req zone=api_limit burst=5 nodelay;

			proxy_pass http://172.17.0.1:1337/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;

			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_redirect off;
		}
	}

	# api.global4pl.cz
	server {
		listen 443 ssl;
		http2 on;
		server_name api.global4pl.cz;

		# paths to SSL certs and key files (path in nginx container, docker-compose.yml volumes binding)
		ssl_certificate 		/etc/letsencrypt/live/nest.global4pl.cz/fullchain.pem; # api.global4pl.cz is also included in the cert saved there
		ssl_certificate_key 	/etc/letsencrypt/live/nest.global4pl.cz/privkey.pem;

		access_log /var/log/nginx/api.global4pl.cz-access.log;

		limit_conn conn_limit 20;

		# credential endpoints get a much tighter limit than the rest of the API
		location /auth/ {
			limit_req zone=login_limit burst=5 nodelay;

			proxy_pass http://g4pl-backend:82/auth/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location / {
			limit_req zone=api_limit burst=5 nodelay;

			proxy_pass http://g4pl-backend:82/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}

	# app.global4pl.cz
	server {
		listen 443 ssl;
		http2 on;
		server_name app.global4pl.cz;

		# paths to SSL certs and key files (path in nginx container, docker-compose.yml volumes binding)
		ssl_certificate 		/etc/letsencrypt/live/nest.global4pl.cz/fullchain.pem; # app.global4pl.cz is also included in the cert saved there
		ssl_certificate_key 	/etc/letsencrypt/live/nest.global4pl.cz/privkey.pem;

		access_log /var/log/nginx/app.global4pl.cz-access.log;

		limit_conn conn_limit 20;

		# vue.js app
		location / {
			root /usr/share/nginx/app;
			index index.html;
			try_files $uri $uri/ /index.html;
		}

		# login / logout / session check - brute force guard
		location /api/auth/ {
			limit_req zone=login_limit burst=5 nodelay;

			proxy_pass http://g4pl-backend:82/auth/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# pass /api/* calls to backend
		location /api/ {
			limit_req zone=api_limit burst=5 nodelay;

			proxy_pass http://g4pl-backend:82/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}

	# nest.global4pl.cz
	server {
		listen 443 ssl;
		http2 on;
		server_name nest.global4pl.cz;

		# paths to SSL certs and key files (path in nginx container, docker-compose.yml volumes binding)
		ssl_certificate 		/etc/letsencrypt/live/nest.global4pl.cz/fullchain.pem;
		ssl_certificate_key 	/etc/letsencrypt/live/nest.global4pl.cz/privkey.pem;

		access_log /var/log/nginx/nest.global4pl.cz-access.log;

		limit_conn conn_limit 20;

		# ACME challenge for SSL cert
		#location ~ /.well-known/acme-challenge/ {
		#	root /var/www/certbot;
		#}

		# vue.js app
		location / {
			root /usr/share/nginx/nest;
			index index.html;
			try_files $uri $uri/ /index.html;
		}

		location /api/auth/ {
			limit_req zone=login_limit burst=5 nodelay;

			proxy_pass http://backend:80/auth/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# pass /api/* calls to backend
		location /api/ {
			limit_req zone=api_limit burst=5 nodelay;

			proxy_pass http://backend:80/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
